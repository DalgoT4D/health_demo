version: 2

models:
  - name: dim_health_households
    description: Household dimension built from all raw program sources with best available geography.
    columns:
      - name: household_id
        tests:
          - not_null
          - unique

  - name: dim_health_beneficiaries
    description: Beneficiary dimension combining clinic, maternal, sanitary distribution, and chatbot records.
    columns:
      - name: beneficiary_id
        tests:
          - not_null
          - unique

  - name: dim_health_children
    description: Child dimension combining child development tracking and child clinic records.
    columns:
      - name: child_id
        tests:
          - not_null
          - unique

  - name: fct_health_clinic_meetings
    description: Deduplicated clinic and doctor meeting fact table for appointment dashboards.
    columns:
      - name: clinic_meeting_row_sk
        tests:
          - not_null
          - unique
      - name: meeting_id
        tests:
          - not_null

  - name: fct_health_sanitary_distribution
    description: Deduplicated sanitary product distribution fact table.
    columns:
      - name: sanitary_distribution_row_sk
        tests:
          - not_null
          - unique
      - name: distribution_id
        tests:
          - not_null

  - name: fct_health_child_development_visits
    description: Deduplicated child development visit fact table.
    columns:
      - name: child_development_row_sk
        tests:
          - not_null
          - unique
      - name: tracking_id
        tests:
          - not_null

  - name: fct_health_maternal_risk_visits
    description: Deduplicated maternal risk visit fact table.
    columns:
      - name: maternal_risk_row_sk
        tests:
          - not_null
          - unique
      - name: visit_id
        tests:
          - not_null

  - name: fct_health_chatbot_interactions
    description: Deduplicated chatbot interaction fact table.
    columns:
      - name: chatbot_interaction_row_sk
        tests:
          - not_null
          - unique
      - name: interaction_id
        tests:
          - not_null

  - name: mart_health_service_events
    description: Unified event fact across clinic, menstrual health, child development, maternal health, and chatbot programs.
    columns:
      - name: event_sk
        tests:
          - not_null
          - unique
      - name: program_area
        tests:
          - accepted_values:
              values: ['Clinic Delivery', 'Menstrual Health', 'Child Development', 'Maternal Risk', 'Chatbot Operations']
      - name: program_label
        description: Human-readable program name for dashboard display and drilldown tables.
